<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客室点検アプリ</title>
  <style>
    /* =========================================
       基本スタイル・リスト画面
       ========================================= */
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      color: #333;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background-color: #fff;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .filter-area select {
      padding: 5px;
      font-size: 1rem;
    }
    .map-btn {
      padding: 8px 12px;
      background-color: #4a5568;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .list-container {
      padding: 15px;
    }
    
    /* =========================================
       エラー画面（8秒通信タイムアウト用）
       ========================================= */
    #error-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }
    #error-overlay.hidden {
      display: none;
    }
    .retry-btn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1.2rem;
      background-color: #e53e3e;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    /* =========================================
       マップ画面（スナップショット表示）
       ========================================= */
    #map-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #f7fafc;
      z-index: 9999;
      display: flex;
      flex-direction: column;
    }
    #map-modal.hidden {
      display: none;
    }
    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #fff;
      border-bottom: 1px solid #e2e8f0;
    }
    .map-title-area h2 {
      margin: 0;
      font-size: 1.1rem;
      color: #2d3748;
    }
    .timestamp {
      font-size: 0.8rem;
      color: #718096;
      margin-top: 4px;
      display: block;
    }
    .map-actions {
      display: flex;
      gap: 8px;
    }
    .refresh-btn, .close-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .refresh-btn { background-color: #edf2f7; color: #4a5568; border: 1px solid #cbd5e0; }
    .close-btn { background-color: #e53e3e; color: white; }

    #map-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      padding: 16px;
      flex: 1;
      align-content: start;
    }
    .map-cell {
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      border: 1px solid #a0aec0;
      border-radius: 4px;
      background-color: #fff;
      font-size: 0.95rem;
      color: #2d3748;
    }
    .map-cell.empty {
      background-color: transparent;
      border: none;
    }

    /* マップ用ステータスカラー */
    .status-inspected { background-color: #63b3ed; color: #fff; border-color: #4299e1; } /* 点検完了 */
    .status-cleaning  { background-color: #f6e05e; color: #744210; border-color: #d69e2e; } /* 出発済(清掃中) */
    .status-staying   { background-color: #a0aec0; color: #fff; border-color: #718096; } /* 滞在 */
  </style>
</head>
<body>

  <header>
    <div class="filter-area">
      <select id="floor-filter">
        <option value="all">全フロア</option>
        <option value="6">6階</option>
        <option value="5">5階</option>
        <option value="4">4階</option>
        <option value="3">3階</option>
        <option value="2">2階</option>
        <option value="1">1階</option>
      </select>
    </div>
    <button id="btn-map-toggle" class="map-btn">🗺 準備状況マップ</button>
  </header>

  <main class="list-container" id="list-container">
    <p>データ読み込み中...</p>
  </main>

  <div id="error-overlay" class="hidden">
    <h3>通信エラーが発生しました</h3>
    <p>電波状況を確認し、再読み込みしてください。</p>
    <button id="btn-retry" class="retry-btn">↻ 再読み込み</button>
  </div>

  <div id="map-modal" class="hidden">
    <div class="map-header">
      <div class="map-title-area">
        <h2>全館準備状況</h2>
        <span id="map-timestamp" class="timestamp">--:-- 時点</span>
      </div>
      <div class="map-actions">
        <button id="btn-map-refresh" class="refresh-btn">↻ 更新</button>
        <button id="btn-map-close" class="close-btn">✕ 閉じる</button>
      </div>
    </div>
    <div id="map-grid"></div>
  </div>

  <script>
    /* =========================================================
       設定値とグローバル変数
       ========================================================= */
    const GAS_WEB_APP_URL = 'ここにGASのデプロイURLを設定してください';
    
    let latestRoomData = []; // 最新の客室データを保持（マップ描画用）
    let currentAbortController = null;
    let isMapOpen = false; // マップ展開中はリスト描画等のDOM操作を抑制するためのフラグ

    /* 添付画像を再現するレイアウト定義（7列構成） */
    const mapLayout = [
      [601, 602, 603, null, 605, null, null],
      [501, 502, 503, null, 505, null, null],
      [401, 402, 403, 404, 405, 406, null],
      [301, 302, 303, 304, 305, 306, 307 ],
      [201, 202, 203, null, 205, 207, 208 ],
      [101, 102, 103, null, 105, 107, 108 ]
    ];

    /* =========================================================
       1. バックエンド通信とポーリング処理（数珠つなぎ・タイムアウト）
       ========================================================= */
    async function fetchRoomData() {
      // 古い通信が残っていれば破棄
      if (currentAbortController) {
        currentAbortController.abort();
      }
      currentAbortController = new AbortController();
      const signal = currentAbortController.signal;

      // 8秒で通信を強制切断するタイマー
      const timeoutId = setTimeout(() => currentAbortController.abort(), 8000);

      try {
        // ※ fetch ではなく google.script.run を利用している場合は適宜書き換えてください
        const response = await fetch(GAS_WEB_APP_URL, { signal });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error('Network response was not ok');
        
        const data = await response.json();
        
        // 最新データを保持（マップ用）
        latestRoomData = data;

        // マップが開いていない時のみ、リスト側のDOMを描画
        if (!isMapOpen) {
          renderList(data);
        }

        // エラー画面が表示されていた場合は非表示に復帰
        document.getElementById('error-overlay').classList.add('hidden');

        // 数珠つなぎで5秒後に次の取得を実行
        setTimeout(fetchRoomData, 5000);

      } catch (error) {
        clearTimeout(timeoutId);
        // 通信切断（Abort）やネットワークエラー時の処理
        if (error.name === 'AbortError' || error.message === 'Failed to fetch') {
          showErrorUI();
        } else {
          console.error('Fetch error:', error);
          setTimeout(fetchRoomData, 5000); // その他のエラーは一旦リトライ
        }
      }
    }

    function showErrorUI() {
      document.getElementById('error-overlay').classList.remove('hidden');
    }

    /* =========================================================
       2. UI状態の保持（localStorage）とフォーカス残留防止
       ========================================================= */
    const floorFilterEl = document.getElementById('floor-filter');
    
    // フィルター状態の復元
    const savedFloor = localStorage.getItem('selectedFloor');
    if (savedFloor) {
      floorFilterEl.value = savedFloor;
    }

    // フィルター変更時の保存とフォーカス強制解除
    floorFilterEl.addEventListener('change', (e) => {
      localStorage.setItem('selectedFloor', e.target.value);
      e.target.blur(); // フォーカス残留防止（キーボード収納・更新停止回避）
      if (!isMapOpen) renderList(latestRoomData); // 即時反映
    });

    // 入力要素（input/select）全般のフォーカス残留防止
    document.addEventListener('change', (e) => {
      if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') {
        e.target.blur();
      }
    });

    /* =========================================================
       3. リスト描画処理（既存機能のプレースホルダー）
       ========================================================= */
    function renderList(data) {
      if (!data || data.length === 0) return;
      const container = document.getElementById('list-container');
      const currentFloor = floorFilterEl.value;
      
      // 実装済みのリスト生成ロジックをここに記述します
      // （※この関数内では、A2:L34の二次元配列をパースしてHTML化する処理が入ります）
      // 例: container.innerHTML = '...';
    }

    /* =========================================================
       4. 全館マップ機能（スナップショット描画）
       ========================================================= */
    function initMapGrid() {
      const gridContainer = document.getElementById('map-grid');
      gridContainer.innerHTML = ''; 
      mapLayout.forEach(row => {
        row.forEach(roomNum => {
          const cell = document.createElement('div');
          if (roomNum === null) {
            cell.className = 'map-cell empty';
          } else {
            cell.className = 'map-cell';
            cell.id = `map-room-${roomNum}`;
            cell.textContent = roomNum;
          }
          gridContainer.appendChild(cell);
        });
      });
    }

    function updateMapColors(sheetData) {
      if (!sheetData || sheetData.length === 0) return;

      // 取得時刻の更新
      const now = new Date();
      const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      document.getElementById('map-timestamp').textContent = `${timeString} 時点`;

      // データの反映
      sheetData.forEach(row => {
        const roomNum = row[0]; // A列: 部屋番号
        const isDeparted = row[10] === true || row[10] === 'TRUE'; // K列: 出発済
        const isInspected = row[11] === true || row[11] === 'TRUE'; // L列: 点検完了
        
        const cell = document.getElementById(`map-room-${roomNum}`);
        if (cell) {
          cell.className = 'map-cell'; // クラスリセット
          if (isInspected) {
            cell.classList.add('status-inspected');
          } else if (isDeparted) {
            cell.classList.add('status-cleaning');
          } else {
            cell.classList.add('status-staying');
          }
        }
      });
    }

    /* =========================================================
       5. イベントリスナー・初期化
       ========================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      // マップ枠組みの初期生成
      initMapGrid();

      // マップを開く（スナップショット描画）
      document.getElementById('btn-map-toggle').addEventListener('click', () => {
        isMapOpen = true; // バックグラウンドのリスト描画を停止
        document.getElementById('map-modal').classList.remove('hidden');
        updateMapColors(latestRoomData);
      });

      // マップを閉じる
      document.getElementById('btn-map-close').addEventListener('click', () => {
        isMapOpen = false; // リスト描画を再開
        document.getElementById('map-modal').classList.add('hidden');
        // 閉じた瞬間に最新状態のリストを描画
        renderList(latestRoomData); 
      });

      // マップ画面内での手動更新
      document.getElementById('btn-map-refresh').addEventListener('click', () => {
        // ※この時点の latestRoomData はバックグラウンドのfetchにより更新されています
        updateMapColors(latestRoomData);
      });

      // エラーからの手動復帰
      document.getElementById('btn-retry').addEventListener('click', () => {
        document.getElementById('error-overlay').classList.add('hidden');
        fetchRoomData();
      });

      // 初回のデータ取得開始
      fetchRoomData();
    });
  </script>
</body>
</html>
