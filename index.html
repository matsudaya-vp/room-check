<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客室点検 Ver.14.4</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 10px; color: #333; }
        #app-container { max-width: 600px; margin: 0 auto; }
        .filter-container { display: flex; flex-wrap: nowrap; gap: 4px; background: white; padding: 6px 4px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); justify-content: center; align-items: center; overflow-x: auto; }
        .filter-label { display: flex; align-items: center; gap: 4px; font-weight: bold; cursor: pointer; background: #f1f5f9; padding: 5px 8px; border-radius: 6px; font-size: 0.9rem; white-space: nowrap; }
        .refresh-btn { background: #3d85c6; color: white; border: none; padding: 5px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .room-card { border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border-left: 5px solid; transition: background 0.2s; }
        .status-default { background: #b0b5b9; border-left-color: #6b7280; }
        .status-standby { background: #e2e8f0; border-left-color: #666; }
        .status-inspected { background: #e0f2fe; border-left-color: #0ea5e9; }
        .status-departed { background: #fff7ed; border-left-color: #f97316; }
        .status-final { background: #f0fdf4; border-left-color: #22c55e; }
        .room-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .header-info { display: flex; align-items: center; gap: 6px; }
        .room-no { font-size: 1.3rem; font-weight: bold; }
        .room-user { font-size: 0.85rem; background: rgba(255,255,255,0.6); padding: 2px 6px; border-radius: 4px; border: 1px solid #ccc; }
        .early-badge { background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; margin-left: 2px; }
        .header-check-label { border: 1px solid #ccc; padding: 8px 16px; border-radius: 6px; font-weight: bold; display: flex; align-items: center; gap: 8px; cursor: pointer; background: #fff; }
        .view-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 0.85rem; }
        .status-badge { padding: 3px 6px; border-radius: 4px; background: rgba(255,255,255,0.6); font-weight: bold; }
        .status-badge.active { background: #3d85c6; color: white; }
        .memo-inline { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; overflow: hidden; }
        .memo-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .input-label { background: rgba(255, 255, 255, 0.8); border: 1px solid #ddd; padding: 10px 8px; border-radius: 6px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .bottom-controls { display: flex; gap: 10px; border-top: 1px solid #eee; padding-top: 12px; }
        .bottom-select-group { display: flex; align-items: center; gap: 6px; flex: 1; }
        .bottom-select-group select { width: 100%; padding: 6px 4px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.85rem; height: 36px; }
        #diagnostic-console { font-size: 11px; color: #fff; background: #333; padding: 10px; border-radius: 6px; margin-top: 20px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div id="app-container">
        <div class="filter-container">
            <label class="filter-label"><input type="checkbox" value="1" checked onchange="renderAll()"> 1</label>
            <label class="filter-label"><input type="checkbox" value="2" checked onchange="renderAll()"> 2</label>
            <label class="filter-label"><input type="checkbox" value="3" checked onchange="renderAll()"> 3</label>
            <label class="filter-label"><input type="checkbox" value="4" checked onchange="renderAll()"> 4</label>
            <label class="filter-label"><input type="checkbox" value="5" checked onchange="renderAll()"> 5</label>
            <label class="filter-label"><input type="checkbox" value="6" checked onchange="renderAll()"> 6</label>
            <button class="refresh-btn" onclick="fetchData(true)">↻</button>
        </div>
        <div id="room-list-container" style="text-align:center; padding:40px;">読込中...</div>
        <div id="diagnostic-console">READY (Ver.14.4)</div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxK2eeWH-9cTWuBz7omejE_ELuR8hj2ejiHuodfSOELKhrXXptR8NP64oj0KomkzoNgAw/exec';
        let allRooms = [], lists = { staff: [], summary: [], checker: [] };
        let pauseUntil = 0, isFetching = false;

        function log(msg) {
            const el = document.getElementById('diagnostic-console');
            if (el) el.innerText = "[" + new Date().toLocaleTimeString() + "] " + msg;
        }

        window.onerror = (m, u, l) => log("ERROR: " + m + " (L" + l + ")");

        document.addEventListener('DOMContentLoaded', () => {
            log("BOOT: START");
            fetchData(true);
            setInterval(() => fetchData(false), 5000);
        });

        async function fetchData(loadLists) {
            if (isFetching || Date.now() < pauseUntil) return;
            if (document.activeElement && (document.activeElement.tagName === 'SELECT' || document.activeElement.tagName === 'INPUT')) return;

            isFetching = true;
            try {
                const res = await fetch(`${GAS_URL}?lists=${loadLists}&t=${Date.now()}`);
                const text = await res.text();
                if (!text.trim().startsWith('{')) throw new Error("JSON_ERROR");

                const data = JSON.parse(text);
                if (data.error) throw new Error(data.error);

                if (data.lists) lists = data.lists;
                if (data.rooms) syncRooms(data.rooms);
                log("SYNC: OK");
            } catch (e) {
                log("SYNC: FAILED - " + e.message);
                if (allRooms.length === 0) document.getElementById('room-list-container').innerHTML = "ERROR: " + e.message;
            } finally {
                isFetching = false;
            }
        }

        function syncRooms(newRooms) {
            if (!Array.isArray(newRooms)) return;
            if (allRooms.length === 0) {
                allRooms = newRooms;
                renderAll();
                return;
            }
            newRooms.forEach((nr, i) => {
                const or = allRooms[i];
                if (!or || JSON.stringify(nr) !== JSON.stringify(or)) {
                    allRooms[i] = nr;
                    const card = document.getElementById("room-" + nr.rowNumber);
                    if (card) updateCard(card, nr);
                }
            });
        }

        function getStatus(r) {
            const b = String(r.B||"").trim(), h = String(r.H||"").trim(), j = String(r.J||"").trim();
            const isS = (b !== "－－" && b !== "") || (h !== "－－" && h !== "");
            const isP = (j !== "" && !["－－","ーー","着"].includes(j));
            const isD = (r.K === true || String(r.K) === 'true');
            const isC = (r.L === true || String(r.L) === 'true');
            if (isS && isP && isD && isC) return 'status-final';
            if (isD && isC) return 'status-departed';
            if (isC) return 'status-inspected';
            if (isS) return 'status-standby';
            return 'status-default';
        }

        function renderAll() {
            const container = document.getElementById('room-list-container');
            const checked = Array.from(document.querySelectorAll('.filter-container input:checked')).map(c => c.value);
            const frag = document.createDocumentFragment();
            allRooms.forEach(r => {
                const floor = String(r.A).charAt(0);
                if (!checked.includes(floor)) return;
                const card = document.createElement('div');
                card.id = "room-" + r.rowNumber;
                updateCard(card, r);
                frag.appendChild(card);
            });
            container.innerHTML = '';
            container.appendChild(frag);
        }

        function updateCard(card, r) {
            const isE = (r.C === true || String(r.C) === 'true'), isD = (r.K === true || String(r.K) === 'true'), isC = (r.L === true || String(r.L) === 'true');
            card.className = "room-card " + getStatus(r);
            card.innerHTML = `
                <div class="room-header">
                    <div class="header-info"><div class="room-no">${r.A}号室</div><div class="room-user">担: ${r.B || '－－'}</div>${isE ? '<span class="early-badge">E</span>' : ''}</div>
                    <label class="header-check-label"><input type="checkbox" onchange="updateVal(this, ${r.rowNumber}, 12)" ${isC ? 'checked' : ''}> 点検</label>
                </div>
                <div class="view-row">${isD ? '<span class="status-badge active">出発済</span>' : '<span class="status-badge">未出発</span>'}
                    <div class="memo-inline"><span class="memo-label">備考</span><span class="memo-text">${r.I || ''}</span></div></div>
                <div class="edit-grid">
                    <label class="input-label"><input type="checkbox" onchange="updateVal(this, ${r.rowNumber}, 4)" ${r.D ? 'checked' : ''}> 忘れ物</label>
                    <label class="input-label"><input type="checkbox" onchange="updateVal(this, ${r.rowNumber}, 5)" ${r.E ? 'checked' : ''}> 茶器洗浄</label>
                    <label class="input-label"><input type="checkbox" onchange="updateVal(this, ${r.rowNumber}, 6)" ${r.F ? 'checked' : ''}> 備品補充</label>
                    <label class="input-label"><input type="checkbox" onchange="updateVal(this, ${r.rowNumber}, 7)" ${r.G ? 'checked' : ''}> クロゼット</label>
                </div>
                <div class="bottom-controls">
                    <div class="bottom-select-group"><label>摘要</label><select onchange="updateVal(this, ${r.rowNumber}, 8)">${getOpts(lists.summary, r.H)}</select></div>
                    <div class="bottom-select-group"><label>確認</label><select onchange="updateVal(this, ${r.rowNumber}, 10)">${getOpts(lists.checker, r.J)}</select></div>
                </div>`;
        }

        function getOpts(list, cur) {
            let opts = '<option value="">-</option>';
            const safe = Array.isArray(list) ? list : [];
            safe.forEach(v => opts += `<option value="${v}" ${cur==v?'selected':''}>${v}</option>`);
            if (cur && cur!=="" && cur!=="－－" && !safe.includes(cur)) opts += `<option value="${cur}" selected>${cur}</option>`;
            return opts;
        }

        async function updateVal(el, row, col) {
            const v = el.type === 'checkbox' ? el.checked : el.value;
            const r = allRooms.find(r => r.rowNumber === row);
            const colMap = { 4:'D', 5:'E', 6:'F', 7:'G', 8:'H', 10:'J', 12:'L' };
            if (r) {
                r[colMap[col]] = v;
                const card = document.getElementById("room-" + row);
                if (card) card.className = "room-card " + getStatus(r);
            }
            pauseUntil = Date.now() + 8000;
            try {
                const res = await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ row, col, val: v }) });
                log("UPDATE: OK");
            } catch (e) { log("UPDATE: FAILED - " + e.message); }
        }
    </script>
</body>
</html>
