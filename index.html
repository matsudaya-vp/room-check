<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客室点検アプリ</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 10px; color: #333; }
        #app-container { max-width: 600px; margin: 0 auto; }
        .filter-container { display: flex; flex-wrap: nowrap; gap: 4px; background: white; padding: 6px 4px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); justify-content: center; align-items: center; overflow-x: auto; }
        .filter-label { display: flex; align-items: center; gap: 4px; font-weight: bold; cursor: pointer; background: #f1f5f9; padding: 5px 8px; border-radius: 6px; font-size: 0.9rem; white-space: nowrap; }
        .filter-label input { width: 14px; height: 14px; margin: 0; }
        .refresh-btn { background: #3d85c6; color: white; border: none; padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 1.1rem; cursor: pointer; white-space: nowrap; margin-left: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; }
        .refresh-btn:active { background: #296296; }
        
        .room-card { border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border-left: 5px solid; transition: all 0.3s; }
        .room-card.status-default { background: #b0b5b9; border-left-color: #6b7280; }
        .room-card.status-standby { background: #e2e8f0; border-left-color: #666; }
        .room-card.status-inspected { background: #e0f2fe; border-left-color: #0ea5e9; }
        .room-card.status-departed { background: #fff7ed; border-left-color: #f97316; }
        .room-card.status-final { background: #f0fdf4; border-left-color: #22c55e; }
        
        .room-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 8px; flex-wrap: nowrap; gap: 4px; }
        .header-info { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .room-no { font-size: 1.3rem; font-weight: bold; color: #2c3e50; white-space: nowrap; }
        
        .room-user { font-size: 0.85rem; background: rgba(255,255,255,0.6); border: 1px solid #ccc; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
        .early-badge { background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; margin-left: 2px; }

        .header-check-label { border: 1px solid #ccc; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 1rem; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.3s; white-space: nowrap; background: #fff; }
        .header-check-label input { width: 18px; height: 18px; margin: 0; cursor: pointer; }

        .view-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 0.85rem; }
        .status-badge { padding: 3px 6px; border-radius: 4px; background: rgba(255,255,255,0.6); white-space: nowrap; }
        .status-badge.active { background: #ef4444; color: white; }
        
        .memo-inline { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #333; overflow: hidden; }
        .memo-label { font-weight: bold; font-size: 0.75rem; color: #444; white-space: nowrap; }
        .memo-text { font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .input-label { background: rgba(241, 245, 249, 0.7); padding: 10px 8px; border-radius: 6px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .input-label input { width: 18px; height: 18px; margin: 0; }
        
        .bottom-controls { display: flex; gap: 10px; border-top: 2px solid rgba(0,0,0,0.2); padding-top: 12px; margin-top: 4px; }
        .bottom-select-group { display: flex; align-items: center; gap: 6px; }
        .group-summary { flex: 55; }
        .group-checker { flex: 45; }
        .bottom-select-group label { font-size: 0.8rem; color: #444; white-space: nowrap; }
        .bottom-select-group select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9rem; background-color: rgba(255,255,255,0.9); }

        .loading { text-align: center; padding: 40px; color: #666; }
        .error-msg { background: #fee2e2; border: 1px solid #ef4444; color: #b91c1c; padding: 15px; border-radius: 8px; font-weight: bold; }
        .version-info { text-align: center; font-size: 10px; color: #999; margin-top: 10px; }

        .map-cell { aspect-ratio: 1 / 1; display: flex; justify-content: center; align-items: center; font-weight: bold; border: 1px solid #a0aec0; border-radius: 4px; background-color: #fff; font-size: 0.95rem; color: #333; transition: all 0.2s; }
        .map-cell.empty { background-color: transparent; border: none; }
    </style>
</head>
<body>
    <div id="app-container">
        <div class="filter-container">
            <label class="filter-label"><input type="checkbox" value="1" checked onchange="saveFilters(); renderAll()"> 1</label>
            <label class="filter-label"><input type="checkbox" value="2" checked onchange="saveFilters(); renderAll()"> 2</label>
            <label class="filter-label"><input type="checkbox" value="3" checked onchange="saveFilters(); renderAll()"> 3</label>
            <label class="filter-label"><input type="checkbox" value="4" checked onchange="saveFilters(); renderAll()"> 4</label>
            <label class="filter-label"><input type="checkbox" value="5" checked onchange="saveFilters(); renderAll()"> 5</label>
            <label class="filter-label"><input type="checkbox" value="6" checked onchange="saveFilters(); renderAll()"> 6</label>
            <button class="refresh-btn" onclick="loadData(true)">↻</button>
        </div>
        <div id="room-list-container"><div class="loading">客室データを読み込み中...</div></div>
        <div class="version-info">Ver.13.0（マスタ動的取得・文字化け修正版）</div>
    </div>

    <button id="btn-map-toggle" style="position:fixed; bottom:20px; right:20px; z-index:999; padding:12px 20px; background-color:#4a5568; color:#fff; border-radius:50px; border:none; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,0.3);">全館状況</button>
    <div id="map-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#f7fafc; z-index:9999; flex-direction:column;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid #e2e8f0;">
        <div>
          <h2 style="margin:0; font-size:1.1rem; color:#2d3748;">全館準備状況</h2>
          <span id="map-timestamp" style="font-size:0.8rem; color:#718096;">--:-- 時点</span>
        </div>
        <div style="display:flex; gap:8px;">
          <button id="btn-map-refresh" style="padding:8px 12px; border:1px solid #cbd5e0; background:#edf2f7; color:#4a5568; font-weight:bold; border-radius:4px;">↻ 更新</button>
          <button id="btn-map-close" style="padding:8px 12px; background:#e53e3e; color:#fff; border:none; font-weight:bold; border-radius:4px;">✕ 閉じる</button>
        </div>
      </div>
      <div id="map-grid" style="display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; padding:16px; overflow-y: auto;"></div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxpe9ClGeNKWe8-rIuIDzl5snUVRYDQMWqmulw3S3H4pGm81OOmWgU11Wycxk5sr02L/exec';
        const POLLING_INTERVAL = 10000; 

        let allRoomsData = []; 
        let summaryList = []; // 初回に取得
        let masterStaffList = []; // 初回に取得
        let isMasterLoaded = false; // マスタ取得フラグ

        let pauseRefreshUntil = 0; 
        let isFetching = false;
        let refreshTimer = null; 
        
        const mapLayout = [
          [601, 602, 603, null, 605, null, null],
          [501, 502, 503, null, 505, null, null],
          [401, 402, 403, 404, 405, 406, null],
          [301, 302, 303, 304, 305, 306, 307 ],
          [201, 202, 203, null, 205, 207, 208 ],
          [101, 102, 103, null, 105, 107, 108 ]
        ];

        document.addEventListener('DOMContentLoaded', () => { 
            const savedFilters = localStorage.getItem('selectedFloors');
            if (savedFilters) {
                try {
                    const floors = JSON.parse(savedFilters);
                    document.querySelectorAll('.filter-container input').forEach(cb => {
                        cb.checked = floors.includes(cb.value);
                    });
                } catch(e) { console.error('保存されたフィルターの読み込みに失敗しました', e); }
            }
            initMapGrid();
            loadData(); 
        });

        function saveFilters() {
            const checkedFloors = Array.from(document.querySelectorAll('.filter-container input:checked')).map(cb => cb.value);
            localStorage.setItem('selectedFloors', JSON.stringify(checkedFloors));
        }

        document.addEventListener('click', (e) => {
            const active = document.activeElement;
            if (active && (active.tagName === 'SELECT' || active.tagName === 'INPUT')) {
                if (e.target !== active) {
                    active.blur();
                }
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                pauseRefreshUntil = 0;
                const isMapOpen = document.getElementById('map-modal').style.display === 'flex';
                if (!isFetching && !isMapOpen) {
                    clearTimeout(refreshTimer);
                    loadData(true);
                }
            }
        });

        function initMapGrid() {
          const gridContainer = document.getElementById('map-grid');
          gridContainer.innerHTML = ''; 
          mapLayout.forEach(row => {
            row.forEach(roomNum => {
              const cell = document.createElement('div');
              if (roomNum === null) {
                cell.className = 'map-cell empty';
              } else {
                cell.className = 'map-cell';
                cell.id = `map-room-${roomNum}`;
                cell.textContent = roomNum;
              }
              gridContainer.appendChild(cell);
            });
          });
        }

        async function loadData(force = false) {
            const scheduleNext = () => {
                clearTimeout(refreshTimer);
                refreshTimer = setTimeout(loadData, POLLING_INTERVAL);
            };

            const isMapOpen = document.getElementById('map-modal').style.display === 'flex';
            const isHidden = document.hidden;

            if (!force && (isFetching || Date.now() < pauseRefreshUntil || isMapOpen || isHidden)) {
                scheduleNext();
                return; 
            }

            const active = document.activeElement;
            if (!force && active && (active.tagName === 'SELECT' || (active.tagName === 'INPUT' && active.type !== 'checkbox'))) {
                scheduleNext(); 
                return; 
            }
            
            if (isFetching) return;
            isFetching = true;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);

            try {
                // 初回のみ init=true を付与してマスタデータ取得を要求
                const initParam = !isMasterLoaded ? '&init=true' : '';
                const noCacheUrl = GAS_URL + '?t=' + new Date().getTime() + initParam;
                
                const response = await fetch(noCacheUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await response.json();

                if (Date.now() < pauseRefreshUntil) {
                    isFetching = false;
                    scheduleNext();
                    return;
                }

                // マスタデータの受け取り
                if (data.summaryList) summaryList = data.summaryList;
                if (data.staffList) masterStaffList = data.staffList;
                isMasterLoaded = true; // 取得完了フラグを立てる

                // 客室データの受け取り
                if (data && data.rooms) {
                    allRoomsData = data.rooms;
                } else if (Array.isArray(data)) {
                    allRoomsData = data;
                }

                if (allRoomsData.length > 0) {
                    renderAll(); 
                    if (isMapOpen) renderMapColors(allRoomsData);
                }
            } catch (e) {
                console.error(e);
                const isTimeout = e.name === 'AbortError';
                const errMsg = isTimeout ? '通信がタイムアウトしました' : e.message;
                document.getElementById('room-list-container').innerHTML =
                    `<div class="loading" style="color:#c0392b">読込エラー: ${errMsg}<br>↻ボタンで再試行してください</div>`;
            } finally {
                isFetching = false; 
                scheduleNext(); 
            }
        }

        async function fetchAndRenderMap() {
            const timestampEl = document.getElementById('map-timestamp');
            if (timestampEl) timestampEl.textContent = '取得中...';
            
            if (Date.now() < pauseRefreshUntil) {
                renderMapColors(allRoomsData);
                return;
            }
            await loadData(true);
        }

        function renderMapColors(rooms) {
          if (!rooms || rooms.length === 0) return;
          const now = new Date();
          const timestampEl = document.getElementById('map-timestamp');
          if (timestampEl) {
              timestampEl.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} 更新`;
          }

          const mapStyles = {
            'status-final':     { bg: '#22c55e', text: '#ffffff', border: '#16a34a' }, 
            'status-departed':  { bg: '#f97316', text: '#ffffff', border: '#ea580c' }, 
            'status-inspected': { bg: '#3d85c6', text: '#ffffff', border: '#296296' }, 
            'status-standby':   { bg: '#e2e8f0', text: '#2d3748', border: '#cbd5e0' }, 
            'status-default':   { bg: '#666666', text: '#ffffff', border: '#555555' }  
          };

          rooms.forEach(room => {
            const roomNum = String(room.A); 
            const cell = document.getElementById(`map-room-${roomNum}`);
            if (cell) {
              cell.className = 'map-cell'; 
              const currentStatus = getRoomStatusClass(room);
              const style = mapStyles[currentStatus] || mapStyles['status-default'];
              
              cell.style.backgroundColor = style.bg;
              cell.style.color = style.text;
              cell.style.borderColor = style.border;
            }
          });
        }

        function getFloorNumber(roomName) {
            const str = String(roomName);
            const match = str.match(/^[1-6]/);
            return match ? match[0] : null;
        }

        function getRoomStatusClass(room) {
            const valB = room.B ? String(room.B).trim() : "";
            const valH = room.H ? String(room.H).trim() : "";
            const valJ = room.J ? String(room.J).trim() : "";
            const isDeparted = (room.K === true || String(room.K).toLowerCase() === 'true');
            const isCompleted = (room.L === true || String(room.L).toLowerCase() === 'true');

            const isB_Empty = (valB === "" || valB === "－－" || valB === "ーー" || valB === "--");
            const isH_Empty = (valH === "" || valH === "－－" || valH === "ーー" || valH === "--");
            const isPersonChecked = (valJ !== "" && valJ !== "－－" && valJ !== "ーー" && valJ !== "--" && valJ !== "着");
            const cond1 = (!isB_Empty || !isH_Empty); 

            if (cond1 && isPersonChecked && isDeparted && isCompleted) return 'status-final';      
            else if (isDeparted && isCompleted) return 'status-departed';  
            else if (isCompleted) return 'status-inspected'; 
            else if (cond1) return 'status-standby';   
            else return 'status-default';   
        }

        function renderAll() {
            try {
                if (allRoomsData.length === 0) return;
                const checkedFloors = Array.from(document.querySelectorAll('.filter-container input:checked')).map(cb => cb.value);
                const container = document.getElementById('room-list-container'); 
                const fragment = document.createDocumentFragment();
                
                allRoomsData.forEach(room => {
                    const floor = getFloorNumber(room.A);
                    if (floor !== null && !checkedFloors.includes(floor)) return;
                    
                    const isEarly = (room.C === true || String(room.C).toLowerCase() === 'true');
                    const isDeparted = (room.K === true || String(room.K).toLowerCase() === 'true');
                    const isCompleted = (room.L === true || String(room.L).toLowerCase() === 'true');
                    
                    // 確認者（J列）のプルダウン生成
                    let jOptions = `<option value="">-未選択-</option>`;
                    let currentJ = String(room.J || "").trim();
                    let jFound = false;
                    masterStaffList.forEach(n => {
                        const selected = (currentJ === n) ? 'selected' : '';
                        if(selected) jFound = true;
                        jOptions += `<option value="${n}" ${selected}>${n}</option>`;
                    });
                    if(!jFound && currentJ !== "" && currentJ !== "－－") {
                        jOptions += `<option value="${currentJ}" selected>${currentJ}</option>`;
                    }

                    // 摘要（H列）のプルダウン生成
                    let hOptions = `<option value="">- なし -</option>`;
                    let currentH = String(room.H || "").trim();
                    let hFound = false;
                    summaryList.forEach(h => {
                        const selected = (currentH === h) ? 'selected' : '';
                        if(selected) hFound = true;
                        hOptions += `<option value="${h}" ${selected}>${h}</option>`;
                    });
                    if(!hFound && currentH !== "" && currentH !== "－－") {
                        hOptions += `<option value="${currentH}" selected>${currentH}</option>`;
                    }

                    const card = document.createElement('div');
                    card.className = `room-card ${getRoomStatusClass(room)}`;
                    
                    card.innerHTML = `
                        <div class="room-header">
                            <div class="header-info">
                                <div class="room-no">${room.A}号室</div>
                                <div class="room-user">担当: ${room.B || '未定'}</div>
                                ${isEarly ? '<span class="early-badge">E</span>' : ''}
                            </div>
                            <label class="header-check-label">
                                <input type="checkbox" onchange="updateValue(this, ${room.rowNumber}, 12)" ${isCompleted ? 'checked' : ''}> 点検
                            </label>
                        </div>
                        <div class="view-row">
                            ${isDeparted ? '<span class="status-badge active">出発済</span>' : '<span class="status-badge">未出発</span>'}
                            <div class="memo-inline">
                                <span class="memo-label">備考</span><span class="memo-text">${room.I || ''}</span>
                            </div>
                        </div>
                        <div class="edit-grid">
                            <label class="input-label"><input type="checkbox" onchange="updateValue(this, ${room.rowNumber}, 4)" ${room.D ? 'checked' : ''}> 忘れ物</label>
                            <label class="input-label"><input type="checkbox" onchange="updateValue(this, ${room.rowNumber}, 5)" ${room.E ? 'checked' : ''}> 茶器洗浄</label>
                            <label class="input-label"><input type="checkbox" onchange="updateValue(this, ${room.rowNumber}, 6)" ${room.F ? 'checked' : ''}> 備品補充</label>
                            <label class="input-label"><input type="checkbox" onchange="updateValue(this, ${room.rowNumber}, 7)" ${room.G ? 'checked' : ''}> クローゼット</label>
                        </div>
                        <div class="bottom-controls">
                            <div class="bottom-select-group group-summary">
                                <label>摘要</label>
                                <select onchange="updateValue(this, ${room.rowNumber}, 8)">
                                    ${hOptions}
                                </select>
                            </div>
                            <div class="bottom-select-group group-checker">
                                <label>確認者</label>
                                <select onchange="updateValue(this, ${room.rowNumber}, 10)">
                                    ${jOptions}
                                </select>
                            </div>
                        </div>`;
                    fragment.appendChild(card);
                });
                container.innerHTML = '';
                container.appendChild(fragment);
            } catch (e) { console.error(e); }
        }

        function updateValue(el, row, col) {
            const val = el.type === 'checkbox' ? el.checked : el.value;
            const colMap = { 3:'C', 4:'D', 5:'E', 6:'F', 7:'G', 8:'H', 10:'J', 11:'K', 12:'L' }; 
            const targetRoom = allRoomsData.find(r => r.rowNumber === row); 
            if (targetRoom) targetRoom[colMap[col]] = val;
            const card = el.closest('.room-card');
            
            if (card && targetRoom) {
                card.className = `room-card ${getRoomStatusClass(targetRoom)}`;
                renderMapColors(allRoomsData);
            }
            pauseRefreshUntil = Date.now() + 8000; 
            
            el.blur();

            fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ row: row, col: col, val: val }) })
                .catch(e => console.error('送信エラー:', e));
        }

        document.getElementById('btn-map-toggle').addEventListener('click', () => {
            document.getElementById('map-modal').style.display = 'flex';
            renderMapColors(allRoomsData);
        });

        document.getElementById('btn-map-close').addEventListener('click', () => {
            document.getElementById('map-modal').style.display = 'none';
            loadData(true);
        });

        document.getElementById('btn-map-refresh').addEventListener('click', () => {
            fetchAndRenderMap();
        });
    </script>
</body>
</html>
