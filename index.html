<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客室点検アプリ</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 10px; color: #333; }
        #app-container { max-width: 600px; margin: 0 auto; }
        .filter-container { display: flex; flex-wrap: nowrap; gap: 4px; background: white; padding: 6px 4px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); justify-content: center; align-items: center; overflow-x: auto; }
        .filter-label { display: flex; align-items: center; gap: 4px; font-weight: bold; cursor: pointer; background: #f1f5f9; padding: 5px 8px; border-radius: 6px; font-size: 0.9rem; white-space: nowrap; }
        .filter-label input { width: 14px; height: 14px; margin: 0; }
        .refresh-btn { background: #3d85c6; color: white; border: none; padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 1.1rem; cursor: pointer; white-space: nowrap; margin-left: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; }
        .refresh-btn:active { background: #296296; }
        
        .room-card { border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border-left: 5px solid; transition: all 0.3s; }
        .room-card.status-default { background: #b0b5b9; border-left-color: #6b7280; }
        .room-card.status-standby { background: #e2e8f0; border-left-color: #94a3b8; }
        .room-card.status-inspected { background: #3d85c6; border-left-color: #296296; color: white; }
        .room-card.status-departed { background: #fff7ed; border-left-color: #f97316; color: #333; }
        .room-card.status-final { background: #d9ead3; border-left-color: #b6d7a8; color: #333; }
        
        .room-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .header-info { display: flex; align-items: center; gap: 8px; }
        .room-no { font-size: 1.3rem; font-weight: bold; }
        
        .early-badge { background-color: #b91c1c; color: white; font-weight: bold; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .header-check-label { border: 1px solid; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .header-check-label input { width: 18px; height: 18px; }

        .view-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .status-badge { padding: 3px 6px; border-radius: 4px; background: #eee; }
        .status-badge.active { background: #3d85c6; color: white; }
        
        .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .input-label { background: #f8f9fa; padding: 10px; border-radius: 6px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        
        .bottom-controls { display: flex; gap: 10px; border-top: 2px solid #ddd; padding-top: 12px; }
        .bottom-select-group { flex: 1; }
        .bottom-select-group select { width: 100%; padding: 8px; }

        .version-info { text-align: center; font-size: 10px; color: #999; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="app-container">
        <div class="filter-container">
            <button class="refresh-btn" onclick="loadData()">↻</button>
        </div>
        <div id="room-list-container">読み込み中...</div>
        <div class="version-info">Ver.11</div>
    </div>
    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwRaOWsyE02wwANq8zdYgKdvhO7z6rCCrAT_qWzBBMUBhxc6aZj1mbJ6MF-Vdwa0pyJlA/exec';
        let allRoomsData = [];

        document.addEventListener('DOMContentLoaded', loadData);
        
        function loadData() {
            fetch(GAS_URL).then(res => res.json()).then(data => {
                allRoomsData = data;
                renderRooms();
            });
        }
        
        function getRoomStatusClass(room) {
            const isCompleted = (room.L === true || String(room.L).toLowerCase() === 'true'); 
            const isDeparted = (room.K === true || String(room.K).toLowerCase() === 'true');
            const valJ = room.J ? String(room.J).trim() : "";
            const isPersonChecked = (valJ !== "" && valJ !== "－－" && valJ !== "ーー" && valJ !== "--" && valJ !== "着");
            
            if (isPersonChecked && isDeparted && isCompleted) return 'status-final';
            if (isDeparted) return 'status-departed';
            if (isCompleted) return 'status-inspected';
            return 'status-default';
        }
        
        function renderRooms() {
            const container = document.getElementById('room-list-container');
            container.innerHTML = '';
            allRoomsData.forEach(room => {
                const isCompleted = (room.L === true || String(room.L).toLowerCase() === 'true');
                const isEarly = (room.C === true || String(room.C).toLowerCase() === 'true');
                
                const card = document.createElement('div');
                card.className = `room-card ${getRoomStatusClass(room)}`;
                card.innerHTML = `
                    <div class="room-header">
                        <div class="header-info">
                            <div class="room-no">${room.A}号室</div>
                            <div>担当: ${room.B || ''}</div>
                        </div>
                        <div class="header-right">
                            ${isEarly ? '<div class="early-badge">E</div>' : ''}
                            <label class="header-check-label">
                                <input type="checkbox" onchange="updateValue(this, ${room.rowNumber}, 12)" ${isCompleted ? 'checked' : ''}> 点検
                            </label>
                        </div>
                    </div>
                    <div class="edit-grid">
                        <label class="input-label"><input type="checkbox" onchange="updateValue(this, ${room.rowNumber}, 4)" ${room.D ? 'checked' : ''}> 忘れ物</label>
                        <label class="input-label"><input type="checkbox" onchange="updateValue(this, ${room.rowNumber}, 5)" ${room.E ? 'checked' : ''}> 茶器洗浄</label>
                        <label class="input-label"><input type="checkbox" onchange="updateValue(this, ${room.rowNumber}, 6)" ${room.F ? 'checked' : ''}> 備品補充</label>
                        <label class="input-label"><input type="checkbox" onchange="updateValue(this, ${room.rowNumber}, 7)" ${room.G ? 'checked' : ''}> クローゼット</label>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        function updateValue(el, row, col) {
            const val = el.type === 'checkbox' ? el.checked : el.value;
            fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ row, col, val }) });
            // 即時反映
            const target = allRoomsData.find(r => r.rowNumber === row);
            const colMap = { 4:'D', 5:'E', 6:'F', 7:'G', 12:'L' };
            target[colMap[col]] = val;
            el.closest('.room-card').className = `room-card ${getRoomStatusClass(target)}`;
        }
    </script>
</body>
</html>
