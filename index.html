<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CheckNest 客室点検アプリ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;
      color: #243242;
      background: #f7f6f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    #app-container {
      max-width: 600px;
      margin: auto;
    }

    .filter-container {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 4px;
      margin-bottom: 15px;
      overflow-x: auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px #0002;
    }

    .filter-label {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-label input {
      width: 14px;
      height: 14px;
      margin: 0;
    }

    .refresh-btn {
      padding: 5px 12px;
      color: #fff;
      background: #3d85c6;
      border: 0;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .room-card {
      --staff-action-width: 112px;
      padding: 15px;
      margin-bottom: 15px;
      border-left: 5px solid;
      border-radius: 10px;
      box-shadow: 0 1px 4px #0002;
      transition: opacity 0.2s, background-color 0.3s, border-color 0.3s;
    }

    #save-status { font-size: 0.8rem; color: #46596a; }

    .status-default {
      background: #dfe2e3;
      border-left-color: #717b80;
      --status-button: #505b63;
    }

    .status-standby {
      background: #faf8f2;
      border-left-color: #9a9587;
      --status-button: #6a6151;
    }

    .status-inspected {
      background: #e4f0f8;
      border-left-color: #3d7ca6;
      --status-button: #295e80;
    }

    .status-departed {
      background: #fff0dc;
      border-left-color: #c48236;
      --status-button: #985623;
    }

    .status-final {
      background: #e5f0e8;
      border-left-color: #3f795a;
      --status-button: #2d644a;
    }

    .room-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 7px;
      border-bottom: 1px solid #0002;
    }

    .header-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .room-no {
      color: #24364a;
      font-size: 1.3rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .venue {
      color: #111827;
      font-size: 1.15rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .room-user {
      padding: 2px 6px;
      background: #ffffffb3;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .early-badge {
      padding: 3px 8px;
      color: #fff;
      background: #ef4444;
      border-radius: 5px;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .staff-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 var(--staff-action-width);
      width: var(--staff-action-width);
      min-height: 48px;
      padding: 10px 7px;
      background: var(--status-button, #505b63);
      border: 1px solid var(--status-button, #505b63);
      border-radius: 7px;
      color: #fff;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }

    .staff-action.is-recorded {
      background: var(--status-button, #505b63);
      border-color: var(--status-button, #505b63);
    }

    .staff-action:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }

    .header-check-label input,
    .input-label input {
      width: 19px;
      height: 19px;
      margin: 0;
    }

    .guest-block {
      min-height: 38px;
      margin: 2px 0 5px;
    }

    .guest-main {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 18px;
    }

    .guest-name {
      font-size: 1.05rem;
    }

    .guest-count {
      font-weight: 600;
    }

    .guest-furigana {
      margin-top: 2px;
      color: #374151;
      font-size: 0.7rem;
    }

    .view-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
    }

    .status-badge {
      padding: 3px 6px;
      background: #ffffffa6;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-badge.active {
      color: #243242;
      background: #ffffffd9;
    }

    .memo-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
    }

    .memo-label {
      font-size: 0.75rem;
      font-weight: bold;
      white-space: nowrap;
    }

    .memo-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .accordion-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 32px;
      margin: -6px -6px -6px 0;
      padding: 0;
      color: #374151;
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .accordion-toggle:hover,
    .accordion-toggle:focus-visible {
      background: #ffffff70;
    }

    .accordion-chevron {
      font-size: 1rem;
      line-height: 1;
      transition: transform 0.2s;
    }

    .accordion-toggle[aria-expanded="true"] .accordion-chevron {
      transform: rotate(180deg);
    }

    .accordion-panel {
      display: none;
      padding-top: 10px;
    }

    .accordion-panel.is-open {
      display: block;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .input-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      background: #ffffffa6;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .input-label input {
      accent-color: var(--status-button, #505b63);
    }

    .bottom-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 2px solid #0003;
    }

    .bottom-select-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .group-summary {
      flex: 1 1 auto;
      min-width: 0;
    }

    .group-checker {
      flex: 0 0 var(--staff-action-width);
      justify-content: flex-end;
    }

    .bottom-select-group label {
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .bottom-select-group select {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 7px 8px;
      background: #fffffff2;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    .loading {
      padding: 40px;
      color: #666;
      text-align: center;
    }

    .version-info {
      margin-top: 10px;
      color: #999;
      font-size: 10px;
      text-align: center;
    }

    .map-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 88px;
      padding: 4px 2px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #a0aec0;
      border-radius: 4px;
      font-weight: bold;
      text-align: center;
    }

    .map-cell.empty {
      background: transparent;
      border: 0;
    }

    .map-room-no {
      font-size: 0.95rem;
    }

    .map-guest {
      width: 100%;
      overflow: hidden;
      font-size: 0.72rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .map-count {
      font-size: 0.68rem;
      font-weight: normal;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border: 1px solid;
      border-radius: 3px;
    }

    .legend-final {
      background: #22c55e;
      border-color: #16a34a;
    }

    .legend-departed {
      background: #f97316;
      border-color: #ea580c;
    }

    .legend-inspected {
      background: #3d85c6;
      border-color: #296296;
    }

    .legend-standby {
      background: #e2e8f0;
      border-color: #cbd5e0;
    }

    .legend-default {
      background: #666;
      border-color: #555;
    }

    @media (max-width: 430px) {
      body {
        padding: 6px;
      }

      .room-card {
        padding: 12px;
        --staff-action-width: 108px;
      }

      .header-info {
        gap: 6px;
      }

      .room-no {
        font-size: 1.15rem;
      }

      .venue {
        font-size: 1rem;
      }

      .room-user {
        order: 3;
      }

      .staff-action {
        font-size: 0.9rem;
      }

      .bottom-controls {
        flex-direction: row;
        gap: 8px;
      }

      .group-summary {
        flex: 1 1 auto;
        min-width: 0;
      }

      .group-checker {
        flex: 0 0 var(--staff-action-width);
        min-width: 0;
      }

      .map-cell {
        min-height: 74px;
      }
    }
    #staff-picker { width: min(94vw, 580px); border: 1px solid #d1dce4; border-radius: 12px; padding: 16px; }
    #staff-picker::backdrop { background: #18283788; }
    #staff-picker h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .staff-choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .staff-choices button { min-height: 44px; border: 1px solid #cad8d0; border-radius: 6px; background: #fff; color: inherit; }
    .staff-choices button[aria-pressed="true"] { background: #23533b; color: #fff; }
    #staff-picker form { margin-top: 12px; text-align: right; }
  </style>
</head>
<body>
  <div id="app-container">
    <div class="filter-container">
      <label class="filter-label"><input type="checkbox" value="1" checked onchange="saveFilters(); renderAll()"> 1</label>
      <label class="filter-label"><input type="checkbox" value="2" checked onchange="saveFilters(); renderAll()"> 2</label>
      <label class="filter-label"><input type="checkbox" value="3" checked onchange="saveFilters(); renderAll()"> 3</label>
      <label class="filter-label"><input type="checkbox" value="4" checked onchange="saveFilters(); renderAll()"> 4</label>
      <label class="filter-label"><input type="checkbox" value="5" checked onchange="saveFilters(); renderAll()"> 5</label>
      <label class="filter-label"><input type="checkbox" value="6" checked onchange="saveFilters(); renderAll()"> 6</label>
      <button class="refresh-btn" type="button" onclick="loadData(true)" aria-label="更新">&#8635;</button>
      <span id="save-status" role="status"></span>
    </div>
    <div id="room-list-container">
      <div class="loading">客室データを読み込み中...</div>
    </div>
    <div class="version-info">CheckNest Ver.15.0-ma3.4 テスト版</div>
  </div>

  <button id="btn-map-toggle" type="button" style="position:fixed; bottom:20px; right:20px; z-index:999; padding:12px 20px; background:#4a5568; color:#fff; border-radius:50px; border:0; font-weight:bold; box-shadow:0 4px 10px #0005;">
    全館状況
  </button>

  <div id="map-modal" style="display:none; position:fixed; inset:0; background:#f7fafc; z-index:9999; flex-direction:column;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid #e2e8f0;">
      <div>
        <h2 style="margin:0; font-size:1.1rem;">全館状況</h2>
        <span id="map-timestamp" style="font-size:0.8rem; color:#718096;">--:-- 時点</span>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="btn-map-refresh" type="button" style="padding:8px 12px; border:1px solid #cbd5e0; background:#edf2f7; border-radius:4px;">&#8635; 更新</button>
        <button id="btn-map-close" type="button" style="padding:8px 12px; background:#e53e3e; color:#fff; border:0; border-radius:4px;">閉じる</button>
      </div>
    </div>
    <div style="flex:1; overflow-y:auto; display:flex; justify-content:center;">
      <div style="width:100%; max-width:600px; padding-bottom:40px;">
        <div id="map-grid" style="display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; padding:16px;"></div>
        <div style="display:flex; flex-wrap:wrap; gap:12px; padding:0 16px; margin-top:20px; font-size:0.85rem; justify-content:center;">
          <div class="legend-item"><span class="legend-color legend-final"></span>最終完了</div>
          <div class="legend-item"><span class="legend-color legend-departed"></span>出発済</div>
          <div class="legend-item"><span class="legend-color legend-inspected"></span>点検済</div>
          <div class="legend-item"><span class="legend-color legend-standby"></span>準備中</div>
          <div class="legend-item"><span class="legend-color legend-default"></span>未使用</div>
        </div>
      </div>
    </div>
  </div>

  <dialog id="staff-picker" aria-labelledby="staff-picker-title">
    <h2 id="staff-picker-title"></h2>
    <div class="staff-choices"></div>
    <form method="dialog"><button type="submit">閉じる</button></form>
  </dialog>
  <script>
    // MA3専用です。本番の room-check-prod には、このファイルを配置しません。
    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbzal4UfpLACFd3tP4lCN_OMvxvwkGUALWEPoTNdlcoKsO4EoP_uRXCzeKjh-OUroZGH5g/exec';
    const POLLING_INTERVAL = 10000;
    const POST_TIMEOUT_MS = 8000;
    const FILTER_STORAGE_KEY = 'selectedFloors';
    const ACCORDION_STORAGE_KEY = 'checkNestOpenRooms';

    let allRoomsData = [];
    let summaryList = [];
    let masterStaffList = [];
    let inspectorList = [];
    let isMasterLoaded = false;
    let currentDataVersion = '';
    let lastSuccessfulFetchAt = null;
    let isFetching = false;
    let refreshTimer = null;

    const mapLayout = [
      [601, 602, 603, null, 605, null, null],
      [501, 502, 503, null, 505, null, null],
      [401, 402, 403, 404, 405, 406, null],
      [301, 302, 303, 304, 305, 306, 307],
      [201, 202, 203, null, 205, 207, 208],
      [101, 102, 103, null, 105, 107, 108]
    ];

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#096;');
    }

    function shouldAppendHonorific(guestName) {
      const normalizedName = String(guestName ?? '').trim();
      return (
        normalizedName !== '' &&
        normalizedName !== '予備' &&
        normalizedName !== '予備部屋' &&
        normalizedName !== '緊急時用'
      );
    }

    function getMapGuestName(guestName) {
      const normalizedName = String(guestName ?? '').trim();

      if (normalizedName === '') {
        return '';
      }

      if (
        normalizedName === '予備' ||
        normalizedName === '予備部屋'
      ) {
        return '予備';
      }

      if (normalizedName === '緊急時用') {
        return '緊急';
      }

      const surname = normalizedName.split(/[ \u3000]+/)[0];
      return Array.from(surname).slice(0, 3).join('');
    }

    function isTrue(value) {
      return value === true || String(value).toLowerCase() === 'true';
    }

    function isBlankChoice(value) {
      return (
        value === '' ||
        value === '－－' ||
        value === 'ーー' ||
        value === '--'
      );
    }

    function getOpenRoomRows() {
      try {
        const savedValue = JSON.parse(
          localStorage.getItem(ACCORDION_STORAGE_KEY) || '[]'
        );
        return new Set(
          Array.isArray(savedValue) ? savedValue.map(String) : []
        );
      } catch (error) {
        console.error('アコーディオン状態を読み込めませんでした', error);
        return new Set();
      }
    }

    function saveOpenRoomRows(openRoomRows) {
      try {
        localStorage.setItem(
          ACCORDION_STORAGE_KEY,
          JSON.stringify([...openRoomRows])
        );
      } catch (error) {
        console.error('アコーディオン状態を保存できませんでした', error);
      }
    }

    function toggleAccordion(button, roomRowNumber) {
      const viewRow = button.closest('.view-row');
      const panel = viewRow ? viewRow.nextElementSibling : null;
      if (!panel) {
        return;
      }

      const willOpen = !panel.classList.contains('is-open');
      panel.classList.toggle('is-open', willOpen);
      button.setAttribute('aria-expanded', String(willOpen));

      const openRoomRows = getOpenRoomRows();
      const roomKey = String(roomRowNumber);

      if (willOpen) {
        openRoomRows.add(roomKey);
      } else {
        openRoomRows.delete(roomKey);
      }

      saveOpenRoomRows(openRoomRows);
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        const savedFloors = JSON.parse(
          localStorage.getItem(FILTER_STORAGE_KEY) || 'null'
        );

        if (Array.isArray(savedFloors)) {
          document
            .querySelectorAll('.filter-container input')
            .forEach((checkbox) => {
              checkbox.checked = savedFloors.includes(checkbox.value);
            });
        }
      } catch (error) {
        console.error('フロア選択を読み込めませんでした', error);
      }

      initMapGrid();
      loadData();
    });

    function saveFilters() {
      const selectedFloors = [
        ...document.querySelectorAll('.filter-container input:checked')
      ].map((checkbox) => checkbox.value);

      try {
        localStorage.setItem(
          FILTER_STORAGE_KEY,
          JSON.stringify(selectedFloors)
        );
      } catch (error) {
        console.error('フロア選択を保存できませんでした', error);
      }
    }

    document.addEventListener('click', (event) => {
      const activeElement = document.activeElement;
      const isFormControl =
        activeElement &&
        (activeElement.tagName === 'SELECT' ||
          activeElement.tagName === 'INPUT');

      if (isFormControl && event.target !== activeElement) {
        activeElement.blur();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') {
        return;
      }

      const isMapOpen =
        document.getElementById('map-modal').style.display === 'flex';

      if (!isFetching && !isMapOpen) {
        clearTimeout(refreshTimer);
        loadData(true);
      }
    });

    function initMapGrid() {
      const gridContainer = document.getElementById('map-grid');
      gridContainer.replaceChildren();

      mapLayout.flat().forEach((roomNumber) => {
        const cell = document.createElement('div');

        if (roomNumber === null) {
          cell.className = 'map-cell empty';
          gridContainer.appendChild(cell);
          return;
        }

        cell.className = 'map-cell';
        cell.id = 'map-room-' + roomNumber;

        const roomNumberElement = document.createElement('div');
        roomNumberElement.className = 'map-room-no';
        roomNumberElement.textContent = roomNumber;

        const guestNameElement = document.createElement('div');
        guestNameElement.className = 'map-guest';

        const guestCountElement = document.createElement('div');
        guestCountElement.className = 'map-count';

        cell.append(
          roomNumberElement,
          guestNameElement,
          guestCountElement
        );
        gridContainer.appendChild(cell);
      });
    }

    function extractVersion(responseData) {
      if (!responseData || Array.isArray(responseData)) {
        return '';
      }

      return (
        responseData.dataVersion ??
        responseData.version ??
        responseData.currentDataVersion ??
        responseData.data_version ??
        ''
      );
    }

    async function callServer(method, data, signal) {
      if (method !== 'loadTestRooms' && method !== 'saveTestRoom') {
        throw new Error('通信処理が正しく指定されていません。');
      }
      if (!window.google?.script?.run) {
        const requestUrl = new URL(GAS_URL);
        requestUrl.searchParams.set('api', '1');
        requestUrl.searchParams.set('t', String(Date.now()));
        if (method === 'loadTestRooms' && data === true) {
          requestUrl.searchParams.set('init', 'true');
        }
        const options = { signal, cache: 'no-store', credentials: 'omit' };
        if (method === 'saveTestRoom') {
          options.method = 'POST';
          options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
          options.body = JSON.stringify(data);
        }
        const response = await fetch(requestUrl.toString(), options);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        try {
          return await response.json();
        } catch (error) {
          throw new Error('MA3専用GASの応答を確認できません。デプロイとアクセス設定を確認してください。');
        }
      }
      return new Promise((resolve, reject) => {
        const onAbort = () => reject(new DOMException('通信がタイムアウトしました', 'AbortError'));
        if (signal.aborted) {
          onAbort();
          return;
        }
        signal.addEventListener('abort', onAbort, { once: true });
        const runner = google.script.run
          .withSuccessHandler(result => {
            signal.removeEventListener('abort', onAbort);
            resolve(result);
          })
          .withFailureHandler(error => {
            signal.removeEventListener('abort', onAbort);
            reject(error);
          });
        runner[method](data);
      });
    }

    async function loadData(force = false) {
      const scheduleNextLoad = () => {
        clearTimeout(refreshTimer);
        refreshTimer = setTimeout(loadData, POLLING_INTERVAL);
      };

      const isMapOpen =
        document.getElementById('map-modal').style.display === 'flex';

      if (
        !force &&
        (isFetching ||
          isMapOpen ||
          document.hidden)
      ) {
        scheduleNextLoad();
        return;
      }

      const activeElement = document.activeElement;
      const isEditing =
        activeElement &&
        (activeElement.tagName === 'SELECT' ||
          (activeElement.tagName === 'INPUT' &&
            activeElement.type !== 'checkbox'));

      if (!force && isEditing) {
        scheduleNextLoad();
        return;
      }

      if (isFetching || saving) {
        scheduleNextLoad();
        return;
      }

      const requestGeneration = saveGeneration;
      isFetching = true;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      try {
        const responseData = await callServer('loadTestRooms', !isMasterLoaded, controller.signal);
        if (responseData?.success !== true) {
          throw new Error(responseData?.message || '客室データを取得できませんでした。');
        }
        if (responseData.schema !== 'checknest-ma3' || responseData.apiVersion !== 2) {
          throw new Error('MA3専用GASのAPIバージョン2が必要です。');
        }

        if (saving || requestGeneration !== saveGeneration) {
          return;
        }

        if (Array.isArray(responseData.inspectorList)) {
          inspectorList = responseData.inspectorList;
        }
        if (Array.isArray(responseData?.summaryList)) {
          summaryList = responseData.summaryList;
        }

        if (Array.isArray(responseData?.staffList)) {
          masterStaffList = responseData.staffList;
        }

        if (
          Array.isArray(responseData?.summaryList) &&
          Array.isArray(responseData?.staffList) &&
          Array.isArray(responseData?.inspectorList)
        ) {
          isMasterLoaded = true;
        }

        const receivedRooms = Array.isArray(responseData?.rooms)
          ? responseData.rooms
          : Array.isArray(responseData)
            ? responseData
            : null;

        if (!receivedRooms) {
          throw new Error('客室データの形式が正しくありません');
        }

        const receivedVersion = extractVersion(responseData);
        if (typeof receivedVersion !== 'string' || receivedVersion.trim() === '') {
          throw new Error('データバージョンを取得できませんでした。');
        }
        allRoomsData = receivedRooms;
        currentDataVersion = receivedVersion;

        document.getElementById('save-status').textContent = '';
        lastSuccessfulFetchAt = new Date();
        renderAll();

        if (isMapOpen) {
          renderMapColors(allRoomsData);
        }
      } catch (error) {
        console.error(error);

        document.getElementById('save-status').textContent =
          currentDataVersion ? '取得失敗・表示は前回取得分' : '読込エラー';
        if (!allRoomsData.length) {
          const errorMessage =
            error.name === 'AbortError'
              ? '通信がタイムアウトしました'
              : error.message;

          document.getElementById('room-list-container').innerHTML =
            '<div class="loading" style="color:#c0392b">' +
            '読込エラー: ' +
            escapeHtml(errorMessage) +
            '<br>更新ボタンで再試行してください</div>';
        }
      } finally {
        clearTimeout(timeoutId);
        isFetching = false;
        scheduleNextLoad();
      }
    }

    async function fetchAndRenderMap() {
      const timestampElement = document.getElementById('map-timestamp');

      if (timestampElement) {
        timestampElement.textContent = '取得中...';
      }

      if (saving) {
        renderMapColors(allRoomsData);
        return;
      }

      await loadData(true);
      renderMapColors(allRoomsData);
    }

    function renderMapColors(rooms) {
      if (!Array.isArray(rooms)) {
        return;
      }

      const timestampElement = document.getElementById('map-timestamp');

      if (timestampElement && lastSuccessfulFetchAt) {
        timestampElement.textContent =
          String(lastSuccessfulFetchAt.getHours()).padStart(2, '0') +
          ':' +
          String(lastSuccessfulFetchAt.getMinutes()).padStart(2, '0') +
          ' 取得';
      }

      const statusStyles = {
        'status-final': {
          background: '#22c55e',
          text: '#fff',
          border: '#16a34a'
        },
        'status-departed': {
          background: '#f97316',
          text: '#fff',
          border: '#ea580c'
        },
        'status-inspected': {
          background: '#3d85c6',
          text: '#fff',
          border: '#296296'
        },
        'status-standby': {
          background: '#e2e8f0',
          text: '#2d3748',
          border: '#cbd5e0'
        },
        'status-default': {
          background: '#666',
          text: '#fff',
          border: '#555'
        }
      };

      rooms.forEach((room) => {
        const roomCell = document.getElementById(
          'map-room-' + String(room.A)
        );

        if (!roomCell) {
          return;
        }

        const statusClass = getRoomStatusClass(room);
        const style =
          statusStyles[statusClass] || statusStyles['status-default'];
        roomCell.style.backgroundColor = style.background;
        roomCell.style.color = style.text;
        roomCell.style.borderColor = style.border;

        const guestNameElement = roomCell.querySelector('.map-guest');
        const guestCountElement = roomCell.querySelector('.map-count');

        if (guestNameElement) {
          guestNameElement.textContent = getMapGuestName(room.M);
        }

        if (guestCountElement) {
          guestCountElement.textContent = room.N || '';
        }
      });
    }

    function getFloorNumber(roomName) {
      const floorMatch = String(roomName).match(/^[1-6]/);
      return floorMatch ? floorMatch[0] : null;
    }

    function getRoomStatusClass(room) {
      const staffName = String(room.B || '').trim();
      const summary = String(room.H || '').trim();
      const checkerName = String(room.K || '').trim();
      const isDeparted = isTrue(room.L);
      const isCompleted = !isBlankChoice(String(room.J || '').trim());
      const isCheckedByPerson =
        !isBlankChoice(checkerName) && checkerName !== '着';
      const isStandby =
        !isBlankChoice(staffName) || !isBlankChoice(summary);

      if (
        isStandby &&
        isCheckedByPerson &&
        isDeparted &&
        isCompleted
      ) {
        return 'status-final';
      }

      if (isDeparted && isCompleted) {
        return 'status-departed';
      }

      if (isCompleted) {
        return 'status-inspected';
      }

      if (isStandby) {
        return 'status-standby';
      }

      return 'status-default';
    }

    function buildOptions(items, currentValue, emptyLabel) {
      const optionItems = Array.isArray(items) ? items : [];
      let isCurrentValueFound = false;
      let optionsHtml =
        '<option value="">' + escapeHtml(emptyLabel) + '</option>';

      optionItems.forEach((item) => {
        const optionValue = String(item ?? '');
        const isSelected = currentValue === optionValue;

        if (isSelected) {
          isCurrentValueFound = true;
        }

        optionsHtml +=
          '<option value="' +
          escapeAttribute(optionValue) +
          '"' +
          (isSelected ? ' selected' : '') +
          '>' +
          escapeHtml(optionValue) +
          '</option>';
      });

      if (!isCurrentValueFound && currentValue !== '') {
        optionsHtml +=
          '<option value="' +
          escapeAttribute(currentValue) +
          '" selected>' +
          escapeHtml(currentValue) +
          '</option>';
      }

      return optionsHtml;
    }

    function renderAll() {
      try {
        if (!allRoomsData.length) {
          return;
        }

        const selectedFloors = [
          ...document.querySelectorAll(
            '.filter-container input:checked'
          )
        ].map((checkbox) => checkbox.value);
        const openRoomRows = getOpenRoomRows();
        const roomListContainer =
          document.getElementById('room-list-container');
        const roomFragment = document.createDocumentFragment();

        allRoomsData.forEach((room) => {
          const floorNumber = getFloorNumber(room.A);

          if (
            floorNumber !== null &&
            !selectedFloors.includes(floorNumber)
          ) {
            return;
          }

          const rowNumber = Number(room.rowNumber);

          if (!Number.isInteger(rowNumber)) {
            return;
          }

          const roomNumber = String(room.A ?? '');
          const isEarly = isTrue(room.C);
          const isDeparted = isTrue(room.L);
          const isCompleted = !isBlankChoice(String(room.J || '').trim());
          const isAccordionOpen =
            openRoomRows.has(String(rowNumber));
          const currentInspector = String(room.J || '').trim();
          const currentChecker = String(room.K || '').trim();
          const currentSummary = String(room.H || '').trim();
          const summaryOptions = buildOptions(
            summaryList,
            currentSummary,
            '- なし -'
          );

          const roomCard = document.createElement('article');
          roomCard.className =
            'room-card ' + getRoomStatusClass(room);
          roomCard.dataset.row = String(rowNumber);

          roomCard.innerHTML = `
            <div class="room-header">
              <div class="header-info">
                <div class="room-no">${escapeHtml(roomNumber)}号室</div>
                <div class="venue">${escapeHtml(room.O || '')}</div>
                <div class="room-user">担当: ${escapeHtml(room.B || '未定')}</div>
                ${isEarly ? '<span class="early-badge">E</span>' : ''}
              </div>
              <button class="header-check-label staff-action ${isCompleted ? 'is-recorded' : ''}" type="button"
                onclick="openStaffPicker(${rowNumber}, 10)">
                ${isCompleted ? '点検：' + escapeHtml(currentInspector) : '点検'}
              </button>
            </div>

            <div class="guest-block">
              <div class="guest-main">
                <span class="guest-name">
                  ${room.M
                    ? escapeHtml(room.M) +
                      (shouldAppendHonorific(room.M) ? '　様' : '')
                    : ''}
                </span>
                <span class="guest-count">${escapeHtml(room.N || '')}</span>
              </div>
              <div class="guest-furigana">${escapeHtml(room.P || '')}</div>
            </div>

            <div class="view-row">
              <span class="status-badge ${isDeparted ? 'active' : ''}">
                ${isDeparted ? '出発済' : '未出発'}
              </span>
              <div class="memo-inline">
                <span class="memo-label">備考</span>
                <span
                  class="memo-text"
                  title="${escapeAttribute(room.I || '')}"
                >${escapeHtml(room.I || '')}</span>
              </div>
              <button
                class="accordion-toggle"
                type="button"
                aria-label="点検項目を表示"
                aria-expanded="${String(isAccordionOpen)}"
                onclick="toggleAccordion(this, ${rowNumber})"
              >
                <span class="accordion-chevron" aria-hidden="true">▼</span>
              </button>
            </div>

            <div class="accordion-panel ${isAccordionOpen ? 'is-open' : ''}">
              <div class="edit-grid">
                <label class="input-label">
                  <input
                    type="checkbox"
                    onchange="updateValue(this, ${rowNumber}, 4)"
                    ${isTrue(room.D) ? 'checked' : ''}
                  >
                  忘れ物
                </label>
                <label class="input-label">
                  <input
                    type="checkbox"
                    onchange="updateValue(this, ${rowNumber}, 5)"
                    ${isTrue(room.E) ? 'checked' : ''}
                  >
                  茶器洗浄
                </label>
                <label class="input-label">
                  <input
                    type="checkbox"
                    onchange="updateValue(this, ${rowNumber}, 6)"
                    ${isTrue(room.F) ? 'checked' : ''}
                  >
                  備品補充
                </label>
                <label class="input-label">
                  <input
                    type="checkbox"
                    onchange="updateValue(this, ${rowNumber}, 7)"
                    ${isTrue(room.G) ? 'checked' : ''}
                  >
                  クローゼット
                </label>
              </div>

              <div class="bottom-controls">
                <div class="bottom-select-group group-summary">
                  <label>摘要</label>
                  <select onchange="updateValue(this, ${rowNumber}, 8)">
                    ${summaryOptions}
                  </select>
                </div>
                <div class="bottom-select-group group-checker">
                  <button class="staff-trigger staff-action ${isBlankChoice(currentChecker) ? '' : 'is-recorded'}" type="button" onclick="openStaffPicker(${rowNumber}, 11)">
                    ${isBlankChoice(currentChecker) ? '確認' : '確認：' + escapeHtml(currentChecker)}
                  </button>
                </div>
              </div>
            </div>
          `;

          roomFragment.appendChild(roomCard);
        });

        roomListContainer.replaceChildren(roomFragment);
      } catch (error) {
        console.error('客室カードを表示できませんでした', error);
      }
    }

    function isStaleResponse(responseData) {
      const responseMessage = String(
        responseData?.error ||
        responseData?.message ||
        responseData?.code ||
        ''
      );

      return (
        responseData?.stale === true ||
        responseData?.code === 'STALE_DATA' ||
        responseMessage.includes('古い') ||
        responseMessage.toLowerCase().includes('stale')
      );
    }

    function openStaffPicker(rowNumber, columnNumber) {
      const room = allRoomsData.find(item => Number(item.rowNumber) === rowNumber);
      if (!room) return;
      const dialog = document.getElementById('staff-picker');
      const isInspector = columnNumber === 10;
      const currentValue = isInspector ? room.J : room.K;
      const choices = isInspector ? inspectorList : masterStaffList;
      dialog.querySelector('h2').textContent = isInspector ? '点検者を選択' : '確認者を選択';
      const list = dialog.querySelector('.staff-choices');
      list.replaceChildren();
      for (const value of new Set(choices.map(String).filter(Boolean))) {
        const button = document.createElement('button');
        button.type = 'button';
        button.value = value;
        button.textContent = value;
        button.setAttribute('aria-pressed', String(value === currentValue));
        button.addEventListener('click', () => {
          const card = document.querySelector('.room-card[data-row="' + rowNumber + '"]');
          const control = card?.querySelector(isInspector ? '.header-check-label' : '.staff-trigger');
          dialog.close();
          if (control) updateValue(control, rowNumber, columnNumber, value);
        });
        list.append(button);
      }
      if (!list.childElementCount) list.textContent = '選択肢を取得できませんでした。';
      dialog.showModal();
    }

    const updateColumns = { 3: 'C', 4: 'D', 5: 'E', 6: 'F', 7: 'G', 8: 'H', 10: 'J', 11: 'K', 12: 'L' };
    const pendingSaves = [];
    let saving = false;
    let saveGeneration = 0;

    function updateValue(element, rowNumber, columnNumber, selectedValue) {
      if (!Number.isInteger(rowNumber) || !Number.isInteger(columnNumber)) return;
      const key = updateColumns[columnNumber];
      const room = allRoomsData.find(item => Number(item.rowNumber) === rowNumber);
      if (!room || !key) return;
      if (!currentDataVersion) {
        renderAll();
        alert('最新データを読み込んでから、もう一度入力してください。');
        void loadData(true);
        return;
      }

      const value = selectedValue ?? (element.type === 'checkbox' ? element.checked : element.value);
      if (room[key] === value) return;
      pendingSaves.push({ rowNumber, columnNumber, key, room, value, previous: room[key] });
      saveGeneration++;
      room[key] = value;
      const card = element.closest('.room-card');
      if (card) card.className = 'room-card ' + getRoomStatusClass(room);
      if (columnNumber === 10 || columnNumber === 11) {
        const label = columnNumber === 10 ? '点検' : '確認';
        const hasName = !isBlankChoice(value);
        element.textContent = hasName ? label + '：' + value : label;
        element.classList.toggle('is-recorded', hasName);
      }
      renderMapColors(allRoomsData);
      if (!saving) void drainSaves();
    }

    async function drainSaves() {
      saving = true;
      const status = document.getElementById('save-status');
      status.textContent = '保存中…';
      try {
        while (pendingSaves.length) {
          const job = pendingSaves[0];
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), POST_TIMEOUT_MS);
          try {
            const result = await callServer('saveTestRoom', {
              row: job.rowNumber,
              col: job.columnNumber,
              val: job.value,
              version: currentDataVersion
            }, controller.signal);
            if (isStaleResponse(result)) throw new Error('シートが別の操作で更新されました。');
            const version = extractVersion(result);
            if (result?.success !== true || typeof version !== 'string' || !version.trim()) {
              throw new Error(result?.message || '保存結果を確認できませんでした。');
            }
            currentDataVersion = version;
            pendingSaves.shift();
          } finally {
            clearTimeout(timer);
          }
        }
        status.textContent = '';
      } catch (error) {
        for (const job of pendingSaves.reverse()) job.room[job.key] = job.previous;
        pendingSaves.length = 0;
        currentDataVersion = '';
        renderAll();
        renderMapColors(allRoomsData);
        status.textContent = '再確認が必要';
        alert('保存を確認できなかった入力があります。最新状態を読み込み直します。\n' + error.message);
      } finally {
        saving = false;
        if (!currentDataVersion) void loadData(true);
      }
    }

    window.addEventListener('beforeunload', event => {
      if (saving || pendingSaves.length) {
        event.preventDefault();
        event.returnValue = '';
      }
    });

    document
      .getElementById('btn-map-toggle')
      .addEventListener('click', () => {
        document.getElementById('map-modal').style.display = 'flex';
        renderMapColors(allRoomsData);
      });

    document
      .getElementById('btn-map-close')
      .addEventListener('click', () => {
        document.getElementById('map-modal').style.display = 'none';
        loadData(true);
      });

    document
      .getElementById('btn-map-refresh')
      .addEventListener('click', fetchAndRenderMap);
  </script>
</body>
</html>
